name: Build Ansuni Ankahi Bate Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 20 & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: FRESH START - Rebuild Correct Structure
        run: |
          echo "Finding your real files..."
          APP=$(find . -name "App.tsx" -type f | head -1)
          MAIN=$(find . -name "main.tsx" -type f | head -1)
          COMP_DIR=$(find . -type d -name "components" | head -1)
          SERV_DIR=$(find . -type d -name "services" | head -1)
          echo "App found at: $APP"
          echo "Main found at: $MAIN"
          echo "Components at: $COMP_DIR"
          echo "Services at: $SERV_DIR"
          
          # Backup content
          mkdir -p /tmp/backup
          cp $APP /tmp/backup/App.tsx 2>/dev/null || true
          cp $MAIN /tmp/backup/main.tsx 2>/dev/null || true
          cp -r $COMP_DIR /tmp/backup/components 2>/dev/null || true
          cp -r $SERV_DIR /tmp/backup/services 2>/dev/null || true
          find . -name "*.css" | xargs -I{} cp {} /tmp/backup/ 2>/dev/null || true
          
          # Now create CLEAN structure
          rm -rf src components services dist android
          mkdir -p src/components src/services
          
          # Restore files to correct place
          cp /tmp/backup/App.tsx src/App.tsx 2>/dev/null || echo "App.tsx missing"
          cp /tmp/backup/main.tsx src/main.tsx 2>/dev/null || echo "main.tsx missing"
          cp -r /tmp/backup/components/* src/components/ 2>/dev/null || true
          cp -r /tmp/backup/services/* src/services/ 2>/dev/null || true
          cp /tmp/backup/*.css src/ 2>/dev/null || true
          cp /tmp/backup/*.css ./ 2>/dev/null || true
          ls /tmp/backup/
          
          # Fix main.tsx imports
          cat > src/main.tsx << 'EOF'
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.tsx'
          import './index.css'
          ReactDOM.createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
          EOF
          
          # Create perfect index.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Ansuni Ankahi Bate</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF
          
          # Create vite config
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({
            plugins: [react()],
          })
          EOF
          
          echo "=== FINAL STRUCTURE ==="
          ls -R src | head -100
          cat src/App.tsx | head -20

      - name: Install deps
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @vitejs/plugin-react

      - name: Build Web
        run: npx vite build

      - name: Setup Capacitor & Build APK
        run: |
          rm -rf android
          npx cap init "Ansuni Ankahi Bate" com.ansuni.ankahi --web-dir=dist
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnsuniAnkahiBate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
