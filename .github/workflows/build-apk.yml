name: Build Ansuni Ankahi Bate Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - name: Build web
        run: npm run build
      - name: Init Capacitor
        run: |
          npx cap init "Ansuni Ankahi Bate" com.ansuni.ankahi --web-dir=dist || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnsuniAnkahiBate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
