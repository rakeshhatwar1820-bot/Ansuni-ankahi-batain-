name: Build Ansuni Ankahi Bate Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix ALL Project Structure
        run: |
          echo "=== Before ==="
          ls -la
          echo "=== Finding folders ==="
          find . -type d -name "components" | head -20
          find . -type d -name "services" | head -20
          
          # 1. Agar sab kuch Ansuni-ankahi-batain- subfolder me hai to bahar lao
          if [ -d "Ansuni-ankahi-batain-" ]; then
            cp -rn Ansuni-ankahi-batain-/* . 2>/dev/null || true
            cp -rn Ansuni-ankahi-batain-/.* . 2>/dev/null || true
          fi
          
          # 2. Agar src folder hai to uske andar se components/services bahar lao
          if [ -d "src/components" ]; then mkdir -p components; cp -rn src/components/* components/ 2>/dev/null; fi
          if [ -d "src/services" ]; then mkdir -p services; cp -rn src/services/* services/ 2>/dev/null; fi
          if [ -d "src" ]; then cp -rn src/* . 2>/dev/null || true; fi
          
          # 3. Kahin bhi deep me components/services ho to dhoondh ke lao
          for d in $(find . -type d -name "components" | head -5); do
            if [ "$d" != "./components" ] && [ -d "$d" ]; then mkdir -p ./components; cp -rn $d/* ./components/ 2>/dev/null || true; fi
          done
          for d in $(find . -type d -name "services" | head -5); do
            if [ "$d" != "./services" ] && [ -d "$d" ]; then mkdir -p ./services; cp -rn $d/* ./services/ 2>/dev/null || true; fi
          done
          
          # 4. index.html fix
          sed -i 's|/src/main.tsx|./main.tsx|g' index.html || true
          sed -i 's|../index.css|./index.css|g' main.tsx || true
          sed -i 's|./App.tsx|./App|g' main.tsx || true
          
          echo "=== After fix ==="
          ls -la
          ls -la components/ || true
          ls -la services/ || true
          cat index.html

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @vitejs/plugin-react

      - name: Create vite config if missing
        run: |
          if [ ! -f vite.config.ts ] && [ ! -f vite.config.js ]; then
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({ plugins: [react()], base: './' })
          EOF
          fi
          cat vite.config.ts || cat vite.config.js || true

      - name: Build Web
        run: npx vite build

      - name: Setup Capacitor
        run: |
          rm -rf android
          npx cap init "Ansuni Ankahi Bate" com.ansuni.ankahi --web-dir=dist
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnsuniAnkahiBate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
